<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An interactive experiment in clock time, lived time, and remembered time. Scroll is a time input, not navigation." />
    <title>HOW LONG IS NOW?</title>
    <link rel="canonical" href="https://adamdhickey-collab.github.io/how-long-is-now/" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#060708" />

    <!-- The card the link shows when it is shared. Absolute URLs: scrapers
         do not resolve the relative base the build otherwise uses. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HOW LONG IS NOW?" />
    <meta property="og:title" content="HOW LONG IS NOW?" />
    <meta property="og:description" content="An interactive experiment in clock time, lived time, and remembered time. Scroll is a time input, not navigation." />
    <meta property="og:url" content="https://adamdhickey-collab.github.io/how-long-is-now/" />
    <meta property="og:image" content="https://adamdhickey-collab.github.io/how-long-is-now/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A lake at Lake Harriet on a late-summer afternoon: a stand of elms across the water, the sun high, its light scattered in a path across the surface." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HOW LONG IS NOW?" />
    <meta name="twitter:description" content="An interactive experiment in clock time, lived time, and remembered time." />
    <meta name="twitter:image" content="https://adamdhickey-collab.github.io/how-long-is-now/og.png" />

    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- The world. Fixed; scroll drives time, not the page. -->
    <canvas id="world" aria-hidden="true"></canvas>

    <!-- The HUD: the only UI the piece allows itself. -->
    <div class="hud">
      <p class="hud__scale" id="scale-label">1 SECOND</p>
      <p class="hud__hint" id="scroll-hint">Scroll to leave now.</p>
    </div>

    <!-- The figure: a drafting overlay a scene may annotate its world with.
         Screen-space SVG, because hairlines and labels belong to the DOM. -->
    <svg class="figure" id="figure" aria-hidden="true"></svg>

    <!-- The fixed clock: ruthlessly regular while the world turns fluid. -->
    <p class="clock" id="clock" aria-hidden="true">4:17</p>

    <!-- Scene text, swapped by the manifest. -->
    <p class="caption" id="caption" aria-live="polite"></p>

    <!-- The viewer's eyelids: off the frame until a scene declares a blink. -->
    <div class="lid lid--upper" aria-hidden="true"></div>
    <div class="lid lid--lower" aria-hidden="true"></div>

    <!-- Scroll runway: its height is set from the manifest's total duration. -->
    <div id="runway"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
