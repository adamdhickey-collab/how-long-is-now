<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An interactive experiment in clock time, lived time, and remembered time. Scroll is a time input, not navigation." />
    <title>HOW LONG IS NOW?</title>
    <link rel="canonical" href="https://adamdhickey-collab.github.io/how-long-is-now/" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#060708" />

    <!-- The card the link shows when it is shared. Absolute URLs: scrapers
         do not resolve the relative base the build otherwise uses. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HOW LONG IS NOW?" />
    <meta property="og:title" content="HOW LONG IS NOW?" />
    <meta property="og:description" content="An interactive experiment in clock time, lived time, and remembered time. Scroll is a time input, not navigation." />
    <meta property="og:url" content="https://adamdhickey-collab.github.io/how-long-is-now/" />
    <meta property="og:image" content="https://adamdhickey-collab.github.io/how-long-is-now/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A lake at Lake Harriet on a late-summer afternoon: a stand of elms across the water, the sun high, its light scattered in a path across the surface." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HOW LONG IS NOW?" />
    <meta name="twitter:description" content="An interactive experiment in clock time, lived time, and remembered time." />
    <meta name="twitter:image" content="https://adamdhickey-collab.github.io/how-long-is-now/og.png" />

    <!-- The piece's one other face: Newsreader italic, for its spoken
         lines only. Loaded from Google Fonts with a serif fallback, so
         nothing waits on it and a caption is never in the HUD's sans. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- The world. Fixed; scroll drives time, not the page. -->
    <canvas id="world" aria-hidden="true"></canvas>

    <!-- The HUD: the only UI the piece allows itself. -->
    <div class="hud">
      <p class="hud__scale" id="scale-label">1 SECOND</p>
      <!-- The one invitation the piece makes. It used to be a dim line of
           type that breathed, and it read as decoration: a visitor who
           has not understood that scroll is a time input will not learn
           it from a sentence in the corner. So it is drawn as a gauge —
           a rail with the spans that are waiting below marked on it, and
           a bead falling down it, which is the gesture — and the word the
           whole piece is about is in the light of 4:17, the one colour
           reserved for marking now. -->
      <div class="hint" id="scroll-hint">
        <svg class="hint__gauge" viewBox="0 0 24 84" aria-hidden="true" focusable="false">
          <!-- The top of the axis is the span being stood in — one
               second, and the light of 4:17 is on it — and everything
               below it is the time that is waiting, in tighter and
               tighter ticks. The bead is the gesture. -->
          <line class="hint__rail" x1="12" y1="9" x2="12" y2="70" />
          <line class="hint__tick hint__tick--now" x1="4" y1="9" x2="20" y2="9" />
          <line class="hint__tick" x1="6" y1="28" x2="18" y2="28" />
          <line class="hint__tick" x1="7" y1="43" x2="17" y2="43" />
          <line class="hint__tick" x1="8" y1="57" x2="16" y2="57" />
          <path class="hint__arrow" d="M6.8 65 L12 71.5 L17.2 65" />
          <circle class="hint__glow" cx="12" cy="9" r="6" />
          <circle class="hint__bead" cx="12" cy="9" r="3.2" />
        </svg>
        <span class="hint__body">
          <span class="hint__line">Scroll to leave <em>now</em></span>
          <span class="hint__note">The clock moves, not the page</span>
        </span>
      </div>
    </div>

    <!-- The figure: a drafting overlay a scene may annotate its world with.
         Screen-space SVG, because hairlines and labels belong to the DOM. -->
    <svg class="figure" id="figure" aria-hidden="true"></svg>

    <!-- The fixed clock: ruthlessly regular while the world turns fluid. -->
    <p class="clock" id="clock" aria-hidden="true">4:17</p>

    <!-- Scene text, swapped by the manifest. -->
    <p class="caption" id="caption" aria-live="polite"></p>

    <!-- What the scene shows, for whoever cannot see it: the manifest's
         description of each scene, read out as it is entered. -->
    <p class="sr-only" id="describe" aria-live="polite"></p>

    <!-- The viewer's eyelids: off the frame until a scene declares a blink. -->
    <div class="lid lid--upper" aria-hidden="true"></div>
    <div class="lid lid--lower" aria-hidden="true"></div>

    <!-- Scroll runway: its height is set from the manifest's total duration. -->
    <div id="runway"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
