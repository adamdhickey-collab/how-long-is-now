<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The piece's own mark: a clock stopped at 4:17, the August afternoon
       it opens on. The minute hand is ink; the hour hand is the accent. -->
  <rect width="32" height="32" rx="6" fill="#060708"/>
  <circle cx="16" cy="16" r="10.5" fill="none" stroke="#2a2d31" stroke-width="1.5"/>
  <line x1="16" y1="16" x2="24.8" y2="17.9" stroke="#e8e6e1" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="20.7" y2="19.7" stroke="#d9a95b" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="1.3" fill="#e8e6e1"/>
</svg>
